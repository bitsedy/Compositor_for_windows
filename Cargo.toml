[workspace]
resolver = "2"
members = [
    "crates/compositor-core",
    "crates/compositor-pixel",
    "crates/compositor-gpu",
    "crates/compositor-io",
    "crates/compositor-ai",
    "crates/compositor-desktop",
    "crates/spikes",
]

[workspace.package]
version = "1.0.0"
edition = "2021"
authors = ["Antigravity <antigravity@local>"]
license = "MIT"

[workspace.dependencies]
# Internal workspace crates
compositor-core = { path = "crates/compositor-core" }
compositor-pixel = { path = "crates/compositor-pixel" }
compositor-gpu = { path = "crates/compositor-gpu" }
compositor-io = { path = "crates/compositor-io" }
compositor-ai = { path = "crates/compositor-ai" }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.10", features = ["v4", "serde"] }

# Math & Geometry
glam = { version = "0.29", features = ["serde"] }
bytemuck = { version = "1.18", features = ["derive"] }

# GPU & Graphics
wgpu = { version = "24.0", features = ["dx12", "wgsl"] }
winit = { version = "0.30", features = ["rwh_06"] }
raw-window-handle = "0.6"

# Image processing & Codecs
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "tiff", "webp"] }
fast_image_resize = "5.1"
resvg = "0.44"

# Utilities & System
notify = "6.1"
sha2 = "0.10"
log = "0.4"
env_logger = "0.11"
thiserror = "2.0"
anyhow = "1.0"
criterion = { version = "0.5", features = ["html_reports"] }

# Windows API
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_Pointer",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Direct3D12",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_DirectWrite",
    "Win32_System_SystemInformation",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_Storage_FileSystem",
] }

[profile.dev]
opt-level = 1

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
